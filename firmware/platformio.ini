; Một dự án PlatformIO cho cả 2 board và bộ test chạy trên laptop.
;   Nạp board guard:    pio run -e guard -t upload
;   Nạp board comfort:  pio run -e comfort -t upload
;   Test không cần board: pio test -e native
; Kiến trúc: docs/architecture.md

[platformio]
default_envs = guard, comfort

[esp32_common]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.0
lib_ignore = adapters_fake

[env:guard]
extends = esp32_common
build_src_filter = -<*> +<guard/>

[env:comfort]
extends = esp32_common
build_src_filter = -<*> +<comfort/>

; Biên dịch lõi trên laptop: không có Arduino.h, nên lõi lỡ dính phần cứng là lỗi ngay.
[env:native]
platform = native
build_flags = -std=gnu++17
lib_deps = bblanchon/ArduinoJson@7.2.0
lib_ignore = adapters_esp32
test_framework = unity
