; Một dự án PlatformIO cho cả 2 board và bộ test chạy trên laptop.
;   Nạp board guard:    pio run -e guard -t upload
;   Nạp board comfort:  pio run -e comfort -t upload
;   Test không cần board: pio test -e native
; Kiến trúc: docs/architecture.md

[platformio]
default_envs = guard, comfort

[esp32_common]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.0
; Mỗi môi trường chọn phần nào được biên dịch. Board thật: lõi + adapter esp32. Laptop: lõi + adapter giả.
build_src_filter = -<*> +<shared/core/> +<shared/protocol/> +<shared/services/> +<shared/adapters_esp32/>

[env:guard]
extends = esp32_common
lib_deps =
    ${esp32_common.lib_deps}
    miguelbalboa/MFRC522@1.4.12
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4
; guard không có DHT22 và WS2812, nên không biên dịch adapter của chúng (thư viện DHT và NeoPixel chỉ cài cho comfort)
build_src_filter = ${esp32_common.build_src_filter} -<shared/adapters_esp32/Dht22Sensor.cpp> -<shared/adapters_esp32/Ws2812Strip.cpp> +<guard/>

[env:comfort]
extends = esp32_common
lib_deps =
    ${esp32_common.lib_deps}
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.14
    adafruit/Adafruit NeoPixel@1.15.5
; comfort không có RC522, nên không biên dịch adapter của nó (thư viện MFRC522 chỉ cài cho guard)
; comfort không có RC522 và OLED, nên không biên dịch adapter của chúng (thư viện MFRC522 và SSD1306 chỉ cài cho guard)
build_src_filter = ${esp32_common.build_src_filter} -<shared/adapters_esp32/Rc522Reader.cpp> -<shared/adapters_esp32/Ssd1306Display.cpp> +<comfort/>

; Biên dịch lõi trên laptop: không có Arduino.h, nên lõi lỡ dính phần cứng là lỗi ngay.
[env:native]
platform = native
build_flags =
    -std=gnu++17
lib_deps = bblanchon/ArduinoJson@7.2.0
build_src_filter = -<*> +<shared/core/> +<shared/protocol/> +<shared/services/> +<shared/adapters_fake/>
test_build_src = yes
test_framework = unity
