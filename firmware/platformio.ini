; Một dự án PlatformIO cho cả 2 board.
; Nạp board A:  pio run -e esp32-a -t upload
; Nạp board B:  pio run -e esp32-b -t upload

[platformio]
default_envs = esp32-a, esp32-b

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@2.8
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:esp32-a]
build_src_filter = -<*> +<esp32-a/>

[env:esp32-b]
build_src_filter = -<*> +<esp32-b/>
