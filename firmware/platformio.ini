; Một dự án PlatformIO cho cả 2 board.
; Nạp board guard:   pio run -e guard -t upload
; Nạp board comfort: pio run -e comfort -t upload

[platformio]
default_envs = guard, comfort

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.0
build_flags =
    -Iinclude
    -DCORE_DEBUG_LEVEL=0

[env:guard]
build_src_filter = -<*> +<guard/>

[env:comfort]
build_src_filter = -<*> +<comfort/>
