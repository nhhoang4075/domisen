# Broker MQTT cho Domisen. Chạy từ thư mục này (đường dẫn passwd là tương đối):
#   cd broker && mosquitto -c mosquitto.conf
# Tạo tài khoản một lần: mosquitto_passwd -c passwd domisen

# Nghe trên mọi địa chỉ mạng để ESP32 và máy khác cùng WiFi kết nối được
listener 1883 0.0.0.0

# Không cho kết nối ẩn danh, phải có tài khoản trong file passwd
allow_anonymous false
password_file passwd

# Ghi log mỗi lần có thiết bị nối hoặc ngắt, dễ thấy board đã vào chưa
connection_messages true
